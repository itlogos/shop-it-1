
services:
  postgres:
    image: postgres:16-alpine
    container_name: shopit-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalogue}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-catalogue}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: shop-it-2-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./config/keycloak/import:/opt/keycloak/data/import
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # Без curl: проверяем порт и ждём 200 OK на discovery
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/selmag/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && (timeout 2s cat <&3 | grep -q '200 OK')" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  back:
    image: shop-it-2-back
    container_name: shopit-back
    build:
      context: ./back
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: standalone
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-catalogue}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/selmag
      # На всякий случай фиксируем порт (по умолчанию 8080)
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # Healthcheck без curl/wget (если actuator включён и открыт)
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && (timeout 2s cat <&3 | grep -q '\"status\":\"UP\"')" ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  manager:
    image: shop-it-2-manager
    container_name: shopit-manager
    build:
      context: .
      dockerfile: manager/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: standalone

      # OAuth2 Client: discovery для Keycloak 25
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/selmag

      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MANAGER_APP_PROVIDER: keycloak
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MANAGER_APP_CLIENT_ID: ${MANAGER_CLIENT_ID:-manager-app}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MANAGER_LOGIN_CLIENT_SECRET: ${MANAGER_LOGIN_CLIENT_SECRET:-JwByKV4Y8m95GDYTNqJH6jfaj5dXpv8F}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MANAGER_APP_AUTHORIZATION_GRANT_TYPE: client_credentials

      # Если manager сам валидирует входящие JWT
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/selmag

      # Адресы внутрених сервисов
      APP_CATALOGUE_BASE_URL: http://back:8080
      SERVER_PORT: 8080
    depends_on:
      # back сейчас у тебя падает (Exit/Error), поэтому НЕ ждём его healthy,
      # достаточно чтобы он «запустился». Иначе manager будет вечно «Created».
      back:
        condition: service_started
      keycloak:
        condition: service_healthy
#    healthcheck:
#      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && (timeout 2s cat <&3 | grep -q '\"status\":\"UP\"')" ]
#      interval: 5s
#      timeout: 5s
#      retries: 60
#      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: shopit-nginx
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro   # было: ./nginx/app.conf:/etc/nginx/conf.d/app.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      manager:
        condition: service_started
    restart: unless-stopped

volumes:
  db_data:
