spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/catalogue
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  flyway:
#    schemas:
#      - public
#      - catalogue
    default-schema: catalogue

    schemas: [catalogue]

    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/selmag
server:
  port: 8081
logging:
  level:
    sql: info
