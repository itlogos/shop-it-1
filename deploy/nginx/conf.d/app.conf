# upstream-ы
upstream manager_upstream {
    server manager:8080;
    keepalive 32;
}
upstream back_upstream {
    server back:8080;
    keepalive 32;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/dev.localhost.crt;
    ssl_certificate_key /etc/nginx/certs/dev.localhost.key;

    # базовые proxy-настройки
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header Connection         "";

    # статика менеджера (если есть) и основной UI
    location / {
        proxy_pass http://manager_upstream;
    }

    # пример маршрутизации API на back
    location /api/ {
        proxy_pass http://back_upstream;
    }

    # health для самого nginx
    location = /nginx/health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
